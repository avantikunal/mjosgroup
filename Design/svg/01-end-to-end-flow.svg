<svg viewBox="0 0 1320 1900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4740"/>
    </marker>
  </defs>

  <rect width="1320" height="1900" fill="#f7f5f0"/>

  <text x="660" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1b18">MOS Aftercare — End-to-End Flow</text>
  <text x="660" y="55" text-anchor="middle" font-size="12" fill="#767268">Customer intake through triage to ticket resolution — see docs/PRD.md §5-7 for full detail</text>

  <!-- lane bands -->
  <rect x="0" y="70" width="1320" height="120" fill="#eef4f8"/>
  <rect x="0" y="190" width="1320" height="365" fill="#fdf3ec"/>
  <rect x="0" y="555" width="1320" height="940" fill="#f2f0e9"/>
  <rect x="0" y="1495" width="1320" height="365" fill="#f4f8ec"/>

  <text x="16" y="134" font-size="12" font-weight="700" fill="#1d5f7a" letter-spacing="0.5">CUSTOMER</text>
  <text x="16" y="376" font-size="12" font-weight="700" fill="#8a3f14" letter-spacing="0.5">INTAKE</text>
  <text x="16" y="1029" font-size="12" font-weight="700" fill="#57534e" letter-spacing="0.5">TRIAGE ENGINE</text>
  <text x="16" y="1682" font-size="12" font-weight="700" fill="#2c4a0d" letter-spacing="0.5">OFFICE / FIELD</text>

  <!-- N1 -->
  <rect x="260" y="90" width="620" height="60" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="114" text-anchor="middle" font-size="13" fill="#1c1b18">
    <tspan x="570" dy="0">Customer reports a fault — phone call,</tspan>
    <tspan x="570" dy="17">web form, or the AI voice assistant</tspan>
  </text>
  <line x1="570" y1="150" x2="570" y2="196" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N2a / N2b -->
  <rect x="260" y="200" width="290" height="80" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="405" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a3f14">WEB FORM</text>
  <text x="405" y="240" text-anchor="middle" font-size="12" fill="#1c1b18">
    <tspan x="405" dy="0">Search &amp; select house —</tspan>
    <tspan x="405" dy="15">warranty/commissioning shown</tspan>
    <tspan x="405" dy="15">immediately</tspan>
  </text>

  <rect x="590" y="200" width="290" height="80" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="735" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a3f14">VOICE ASSISTANT</text>
  <text x="735" y="240" text-anchor="middle" font-size="12" fill="#1c1b18">
    <tspan x="735" dy="0">Transcript → fault type, house</tspan>
    <tspan x="735" dy="15">match, error code proposed</tspan>
    <tspan x="735" dy="15">(confidence-scored stub)</tspan>
  </text>

  <path d="M405,280 C405,300 570,300 570,317" fill="none" stroke="#767268" stroke-width="1.5"/>
  <path d="M735,280 C735,300 570,300 570,317" fill="none" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D1 diamond -->
  <polygon points="570,315 720,360 570,405 420,360" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="570" y="356" text-anchor="middle" font-size="11.5" fill="#7a4109">
    <tspan x="570" dy="0">Safety phrase detected?</tspan>
    <tspan x="570" dy="15">(gas smell / CO alarm)</tspan>
  </text>

  <!-- S1 side box (YES) -->
  <line x1="720" y1="360" x2="928" y2="360" stroke="#a11b1b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="352" font-size="11" fill="#a11b1b" font-weight="700">yes</text>
  <rect x="930" y="315" width="330" height="90" rx="10" fill="#fdf2f2" stroke="#a11b1b" stroke-width="1.5"/>
  <text x="1095" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#6b1414">RULE_01 / RULE_02</text>
  <text x="1095" y="356" text-anchor="middle" font-size="11.5" fill="#6b1414">
    <tspan x="1095" dy="0">Emergency protocol · P1 · mandatory</tspan>
    <tspan x="1095" dy="15">human callback. Never auto-processed.</tspan>
  </text>
  <line x1="1095" y1="405" x2="1095" y2="445" stroke="#a11b1b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="1095" cy="465" r="9" fill="#a11b1b"/>
  <circle cx="1095" cy="465" r="13" fill="none" stroke="#a11b1b" stroke-width="1.5"/>
  <text x="1095" y="495" text-anchor="middle" font-size="11" fill="#a11b1b">END — handled as an emergency,</text>
  <text x="1095" y="509" text-anchor="middle" font-size="11" fill="#a11b1b">outside the normal ticket flow</text>

  <!-- D1 NO -->
  <text x="585" y="425" font-size="11" fill="#57534e" font-weight="700">no</text>
  <line x1="570" y1="405" x2="570" y2="441" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N3 -->
  <rect x="260" y="445" width="620" height="70" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="471" text-anchor="middle" font-size="13" fill="#1c1b18">
    <tspan x="570" dy="0">Guided, fault-type-specific questionnaire —</tspan>
    <tspan x="570" dy="17">error code / photo required where the fault type needs it</tspan>
  </text>
  <line x1="570" y1="515" x2="570" y2="561" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N4 -->
  <rect x="260" y="565" width="620" height="70" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="591" text-anchor="middle" font-size="13" fill="#1c1b18">
    <tspan x="570" dy="0">Look up house record — installer, commissioning</tspan>
    <tspan x="570" dy="17">date, warranty terms, service-contract status</tspan>
  </text>
  <line x1="570" y1="635" x2="570" y2="671" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D2 diamond -->
  <polygon points="570,675 720,720 570,765 420,720" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="570" y="716" text-anchor="middle" font-size="12" fill="#7a4109">
    <tspan x="570" dy="0">Commissioning date</tspan>
    <tspan x="570" dy="16">on file?</tspan>
  </text>

  <!-- S2 side box (NO) -->
  <line x1="720" y1="720" x2="928" y2="720" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="712" font-size="11" fill="#b45309" font-weight="700">no</text>
  <rect x="930" y="675" width="330" height="90" rx="10" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="1095" y="698" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4109">RULE_08</text>
  <text x="1095" y="716" text-anchor="middle" font-size="11.5" fill="#7a4109">
    <tspan x="1095" dy="0">Route to back-office for manual warranty</tspan>
    <tspan x="1095" dy="15">verification; priority escalated one level</tspan>
  </text>
  <path d="M1095,765 C1095,880 720,900 572,898" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- D2 YES -->
  <text x="585" y="785" font-size="11" fill="#57534e" font-weight="700">yes</text>
  <line x1="570" y1="765" x2="570" y2="801" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N5 rule cascade -->
  <rect x="240" y="805" width="660" height="190" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="270" y="830" font-size="12.5" font-weight="700" fill="#1c1b18">ORDERED RULE CASCADE — first match wins</text>
  <text x="270" y="853" font-size="12" fill="#1c1b18" font-family="ui-monospace, Consolas, monospace">
    <tspan x="270" dy="0">1. MOS install &#8804;30 days ago         &#8594; RULE_04  labour warranty, no charge</tspan>
    <tspan x="270" dy="24">2. Third-party install               &#8594; RULE_07  refer to original installer</tspan>
    <tspan x="270" dy="24">3. Active service contract            &#8594; RULE_06  covered by contract</tspan>
    <tspan x="270" dy="24">4. Parts warranty + likely mfr defect &#8594; RULE_03  manufacturer claim</tspan>
    <tspan x="270" dy="24">5. Labour warranty still active       &#8594; RULE_05  labour warranty, no charge</tspan>
    <tspan x="270" dy="24">6. None of the above                  &#8594; RULE_09  chargeable repair</tspan>
  </text>
  <line x1="570" y1="995" x2="570" y2="1031" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N6 -->
  <rect x="260" y="1035" width="620" height="60" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="1070" text-anchor="middle" font-size="13" fill="#1c1b18">Check for repeat faults at this site in the last 90 days</text>
  <line x1="570" y1="1095" x2="570" y2="1131" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D3 diamond -->
  <polygon points="570,1135 720,1180 570,1225 420,1180" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="570" y="1176" text-anchor="middle" font-size="12" fill="#7a4109">
    <tspan x="570" dy="0">2+ prior tickets</tspan>
    <tspan x="570" dy="16">for same fault?</tspan>
  </text>

  <!-- S3 side box (YES) -->
  <line x1="720" y1="1180" x2="928" y2="1180" stroke="#1d5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="1172" font-size="11" fill="#1d5f7a" font-weight="700">yes</text>
  <rect x="930" y="1140" width="330" height="80" rx="10" fill="#eef4f8" stroke="#1d5f7a" stroke-width="1.5"/>
  <text x="1095" y="1163" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5f7a">RULE_10</text>
  <text x="1095" y="1181" text-anchor="middle" font-size="11.5" fill="#1d5f7a">
    <tspan x="1095" dy="0">Flag repeat fault · raise priority one</tspan>
    <tspan x="1095" dy="15">level · surface for pattern review</tspan>
  </text>
  <path d="M1095,1220 C1095,1280 720,1290 572,1288" fill="none" stroke="#1d5f7a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- D3 NO -->
  <text x="585" y="1245" font-size="11" fill="#57534e" font-weight="700">no</text>
  <line x1="570" y1="1225" x2="570" y2="1261" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N7 -->
  <rect x="260" y="1265" width="620" height="60" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="1300" text-anchor="middle" font-size="13" fill="#1c1b18">Check required evidence for this fault type (error code / photo)</text>
  <line x1="570" y1="1325" x2="570" y2="1361" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D4 diamond -->
  <polygon points="570,1365 720,1410 570,1455 420,1410" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="570" y="1406" text-anchor="middle" font-size="12" fill="#7a4109">
    <tspan x="570" dy="0">Required evidence</tspan>
    <tspan x="570" dy="16">missing?</tspan>
  </text>

  <!-- S4 side box (YES) -->
  <line x1="720" y1="1410" x2="928" y2="1410" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="1402" font-size="11" fill="#b45309" font-weight="700">yes</text>
  <rect x="930" y="1370" width="330" height="80" rx="10" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="1095" y="1396" text-anchor="middle" font-size="12" fill="#7a4109">
    <tspan x="1095" dy="0">Mark dataQuality = "incomplete"</tspan>
    <tspan x="1095" dy="17">Followed up before billing or closing</tspan>
  </text>
  <path d="M1095,1450 C1095,1500 720,1516 572,1514" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- D4 NO -->
  <text x="585" y="1475" font-size="11" fill="#57534e" font-weight="700">no</text>
  <line x1="570" y1="1455" x2="570" y2="1501" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N8 -->
  <rect x="260" y="1505" width="620" height="70" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="1531" text-anchor="middle" font-size="13" fill="#1c1b18">
    <tspan x="570" dy="0">Ticket created — party, priority, chargeable</tspan>
    <tspan x="570" dy="17">flag, and rule explanation attached</tspan>
  </text>
  <line x1="570" y1="1575" x2="570" y2="1611" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N9 -->
  <rect x="260" y="1615" width="620" height="60" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="1650" text-anchor="middle" font-size="13" fill="#1c1b18">Schedule &amp; dispatch according to priority and assigned party</text>
  <line x1="570" y1="1675" x2="570" y2="1711" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N10 -->
  <rect x="260" y="1715" width="620" height="60" rx="10" fill="#ffffff" stroke="#e2ded3" stroke-width="1.5"/>
  <text x="570" y="1750" text-anchor="middle" font-size="13" fill="#1c1b18">Technician attends, resolves, and closes the ticket</text>
  <line x1="570" y1="1775" x2="570" y2="1806" stroke="#767268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="570" cy="1825" r="9" fill="#1c1b18"/>
  <circle cx="570" cy="1825" r="13" fill="none" stroke="#1c1b18" stroke-width="1.5"/>
</svg>
