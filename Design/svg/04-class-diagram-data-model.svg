<svg viewBox="0 0 1230 860" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#4a4740" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1230" height="860" fill="#ffffff"/>
  <text x="615" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1b18">Aftercare Workbench — Data Model (Class Diagram)</text>

  <!-- helper macro-like reuse via repeated groups -->

  <!-- Site -->
  <g>
    <rect x="60" y="60" width="260" height="168" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
    <line x1="60" y1="86" x2="320" y2="86" stroke="#1c1b18" stroke-width="1.2"/>
    <text x="190" y="78" text-anchor="middle" font-size="13" font-weight="700">Site</text>
    <text x="70" y="102" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="70" dy="0">siteId: string</tspan>
      <tspan x="70" dy="16">customerName, phone: string</tspan>
      <tspan x="70" dy="16">address, eircode: string</tspan>
      <tspan x="70" dy="16">systemType, manufacturer: string</tspan>
      <tspan x="70" dy="16">installedBy: string</tspan>
      <tspan x="70" dy="16">commissioningDate: date?</tspan>
      <tspan x="70" dy="16">warrantyParts/LabourMonths: num</tspan>
      <tspan x="70" dy="16">vulnerableOccupant: boolean</tspan>
    </text>
  </g>

  <!-- ServiceContract -->
  <g>
    <rect x="380" y="60" width="230" height="88" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
    <line x1="380" y1="86" x2="610" y2="86" stroke="#1c1b18" stroke-width="1.2"/>
    <text x="495" y="78" text-anchor="middle" font-size="13" font-weight="700">ServiceContract</text>
    <text x="390" y="102" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="390" dy="0">active: boolean</tspan>
      <tspan x="390" dy="16">plan: string?</tspan>
      <tspan x="390" dy="16">expiresAt: date?</tspan>
    </text>
  </g>

  <!-- Ticket -->
  <g>
    <rect x="60" y="290" width="260" height="184" fill="#fdf3ec" stroke="#b3541e" stroke-width="1.5"/>
    <line x1="60" y1="316" x2="320" y2="316" stroke="#b3541e" stroke-width="1.2"/>
    <text x="190" y="308" text-anchor="middle" font-size="13" font-weight="700">Ticket</text>
    <text x="70" y="332" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="70" dy="0">ticketId, siteId: string</tspan>
      <tspan x="70" dy="16">faultTypeId: string</tspan>
      <tspan x="70" dy="16">state: TicketState</tspan>
      <tspan x="70" dy="16">priority: P1..P4</tspan>
      <tspan x="70" dy="16">assignedParty: string</tspan>
      <tspan x="70" dy="16">chargeable: boolean?</tspan>
      <tspan x="70" dy="16">ruleId, explanation: string</tspan>
      <tspan x="70" dy="16">dataQuality: string</tspan>
      <tspan x="70" dy="16">repeatFault: boolean</tspan>
    </text>
  </g>

  <!-- FaultReport -->
  <g>
    <rect x="380" y="290" width="230" height="152" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
    <line x1="380" y1="316" x2="610" y2="316" stroke="#1c1b18" stroke-width="1.2"/>
    <text x="495" y="308" text-anchor="middle" font-size="13" font-weight="700">FaultReport</text>
    <text x="390" y="332" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="390" dy="0">faultTypeId: string</tspan>
      <tspan x="390" dy="16">errorCode: string?</tspan>
      <tspan x="390" dy="16">photos: string[]</tspan>
      <tspan x="390" dy="16">symptoms: string</tspan>
      <tspan x="390" dy="16">gasSmell, coAlarm: boolean</tspan>
      <tspan x="390" dy="16">channel: phone|web-form|voice</tspan>
    </text>
  </g>

  <!-- FaultType -->
  <g>
    <rect x="670" y="290" width="220" height="136" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
    <line x1="670" y1="316" x2="890" y2="316" stroke="#b45309" stroke-width="1.2"/>
    <text x="780" y="308" text-anchor="middle" font-size="13" font-weight="700">FaultType</text>
    <text x="680" y="332" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="680" dy="0">id, label: string</tspan>
      <tspan x="680" dy="16">priority: P1..P4</tspan>
      <tspan x="680" dy="16">aiMode: assist|human|</tspan>
      <tspan x="680" dy="16">  prohibited|deterministic</tspan>
      <tspan x="680" dy="16">requiresErrorCode/Photo: bool</tspan>
    </text>
  </g>

  <!-- Party -->
  <g>
    <rect x="670" y="460" width="220" height="104" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
    <line x1="670" y1="486" x2="890" y2="486" stroke="#b45309" stroke-width="1.2"/>
    <text x="780" y="478" text-anchor="middle" font-size="13" font-weight="700">Party</text>
    <text x="680" y="502" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="680" dy="0">id, label: string</tspan>
      <tspan x="680" dy="16">accountableRole: string</tspan>
      <tspan x="680" dy="16">chargeableDefault: boolean?</tspan>
    </text>
  </g>

  <!-- TriageDecision -->
  <g>
    <rect x="60" y="540" width="260" height="152" fill="#f4f8ec" stroke="#3f6212" stroke-width="1.5"/>
    <line x1="60" y1="566" x2="320" y2="566" stroke="#3f6212" stroke-width="1.2"/>
    <text x="190" y="558" text-anchor="middle" font-size="13" font-weight="700">TriageDecision</text>
    <text x="90" y="546" font-size="9.5" font-style="italic" fill="#2c4a0d">&#171;pure function result&#187;</text>
    <text x="70" y="582" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="70" dy="0">ruleId, party: string</tspan>
      <tspan x="70" dy="16">priority: P1..P4</tspan>
      <tspan x="70" dy="16">chargeable: boolean?</tspan>
      <tspan x="70" dy="16">aiMode: string</tspan>
      <tspan x="70" dy="16">explanation: string</tspan>
      <tspan x="70" dy="16">dataQuality: string</tspan>
    </text>
  </g>

  <!-- TicketState enum -->
  <g>
    <rect x="380" y="540" width="230" height="160" fill="#ffffff" stroke="#767268" stroke-width="1.5"/>
    <line x1="380" y1="566" x2="610" y2="566" stroke="#767268" stroke-width="1.2"/>
    <text x="495" y="552" text-anchor="middle" font-size="9.5" font-style="italic" fill="#767268">&#171;enumeration&#187;</text>
    <text x="495" y="562" text-anchor="middle" font-size="13" font-weight="700">TicketState</text>
    <text x="390" y="582" font-size="10.5" fill="#4a4740">
      <tspan x="390" dy="0">New · Triage · AwaitingInfo</tspan>
      <tspan x="390" dy="15">Scheduled · EnRoute · OnSite</tspan>
      <tspan x="390" dy="15">AwaitingParts · Resolved</tspan>
      <tspan x="390" dy="15">InvoicePending</tspan>
      <tspan x="390" dy="15">Closed · Reopened</tspan>
    </text>
  </g>

  <!-- VoiceIntakeDraft -->
  <g>
    <rect x="950" y="290" width="240" height="136" fill="#eef4f8" stroke="#1d5f7a" stroke-width="1.5"/>
    <line x1="950" y1="316" x2="1190" y2="316" stroke="#1d5f7a" stroke-width="1.2"/>
    <text x="1070" y="308" text-anchor="middle" font-size="13" font-weight="700">VoiceIntakeDraft</text>
    <text x="960" y="332" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="960" dy="0">transcript: string</tspan>
      <tspan x="960" dy="16">faultType: ScoredValue</tspan>
      <tspan x="960" dy="16">site: ScoredMatch?</tspan>
      <tspan x="960" dy="16">safetyFlags: {gas, co}</tspan>
      <tspan x="960" dy="16">requiresHumanReview: bool</tspan>
    </text>
  </g>

  <!-- ScoredValue -->
  <g>
    <rect x="950" y="460" width="240" height="88" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
    <line x1="950" y1="486" x2="1190" y2="486" stroke="#1c1b18" stroke-width="1.2"/>
    <text x="1070" y="478" text-anchor="middle" font-size="13" font-weight="700">ScoredValue</text>
    <text x="960" y="502" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="960" dy="0">value: string</tspan>
      <tspan x="960" dy="16">score: number, evidence: string[]</tspan>
    </text>
  </g>

  <!-- ScoredMatch -->
  <g>
    <rect x="950" y="580" width="240" height="88" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
    <line x1="950" y1="606" x2="1190" y2="606" stroke="#1c1b18" stroke-width="1.2"/>
    <text x="1070" y="598" text-anchor="middle" font-size="13" font-weight="700">ScoredMatch</text>
    <text x="960" y="622" font-size="11" font-family="ui-monospace, Consolas, monospace">
      <tspan x="960" dy="0">siteId: string</tspan>
      <tspan x="960" dy="16">score: number, evidence: string[]</tspan>
    </text>
  </g>

  <!-- relationships -->
  <!-- Site *- ServiceContract (composition) -->
  <line x1="320" y1="110" x2="380" y2="104" stroke="#1c1b18" stroke-width="1.3"/>
  <polygon points="320,110 332,105 332,115" fill="#1c1b18"/>
  <text x="330" y="98" font-size="10" fill="#4a4740">has</text>

  <!-- Site o- Ticket (aggregation) -->
  <line x1="190" y1="228" x2="190" y2="290" stroke="#1c1b18" stroke-width="1.3"/>
  <polygon points="190,228 184,238 196,238" fill="#ffffff" stroke="#1c1b18" stroke-width="1.3"/>
  <text x="198" y="262" font-size="10" fill="#4a4740">0..* aftercare tickets</text>

  <!-- Ticket *- FaultReport -->
  <line x1="320" y1="366" x2="380" y2="366" stroke="#1c1b18" stroke-width="1.3"/>
  <polygon points="320,366 332,361 332,371" fill="#1c1b18"/>
  <text x="330" y="358" font-size="10" fill="#4a4740">logs</text>

  <!-- Ticket ..> FaultType -->
  <path d="M320,320 C480,270 560,270 668,325" fill="none" stroke="#767268" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <text x="470" y="272" font-size="10" fill="#767268">faultTypeId refers to</text>

  <!-- Ticket ..> Party -->
  <path d="M320,440 C480,490 560,495 668,505" fill="none" stroke="#767268" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <text x="470" y="500" font-size="10" fill="#767268">assignedParty refers to</text>

  <!-- Ticket to TriageDecision (association) -->
  <line x1="190" y1="474" x2="190" y2="540" stroke="#1c1b18" stroke-width="1.3"/>
  <text x="198" y="510" font-size="10" fill="#4a4740">created from</text>

  <!-- Ticket to TicketState (association) -->
  <path d="M320,410 C350,470 350,540 380,600" fill="none" stroke="#1c1b18" stroke-width="1.3"/>
  <text x="330" y="470" font-size="10" fill="#4a4740">state</text>

  <!-- FaultReport ..> Site -->
  <path d="M420,290 C400,180 300,150 232,180" fill="none" stroke="#767268" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <text x="380" y="200" font-size="10" fill="#767268">triaged against</text>

  <!-- VoiceIntakeDraft ..> FaultType -->
  <line x1="950" y1="358" x2="892" y2="345" stroke="#767268" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <text x="895" y="378" font-size="10" fill="#767268">proposes</text>

  <!-- VoiceIntakeDraft ..> Site -->
  <path d="M950,300 C700,120 420,110 322,150" fill="none" stroke="#767268" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dep)"/>
  <text x="650" y="118" font-size="10" fill="#767268">proposes match to</text>

  <!-- VoiceIntakeDraft *- ScoredValue -->
  <line x1="1055" y1="426" x2="1055" y2="460" stroke="#1c1b18" stroke-width="1.3"/>
  <polygon points="1055,426 1049,436 1061,436" fill="#1c1b18"/>

  <!-- VoiceIntakeDraft *- ScoredMatch -->
  <path d="M1085,426 C1130,470 1130,560 1085,580" fill="none" stroke="#1c1b18" stroke-width="1.3"/>
  <polygon points="1085,426 1081,437 1092,433" fill="#1c1b18"/>

  <!-- legend -->
  <g transform="translate(60,740)">
    <rect x="0" y="0" width="1110" height="90" rx="8" fill="#f7f5f0" stroke="#e2ded3"/>
    <text x="16" y="20" font-size="11" font-weight="700" fill="#1c1b18">Legend</text>
    <line x1="20" y1="40" x2="60" y2="40" stroke="#1c1b18" stroke-width="1.3"/>
    <polygon points="60,40 72,35 72,45" fill="#1c1b18"/>
    <text x="80" y="44" font-size="11" fill="#1c1b18">composition (owns, cannot exist without)</text>

    <line x1="320" y1="40" x2="360" y2="40" stroke="#1c1b18" stroke-width="1.3"/>
    <polygon points="360,40 372,35 384,40 372,45" fill="#ffffff" stroke="#1c1b18" stroke-width="1.3"/>
    <text x="392" y="44" font-size="11" fill="#1c1b18">aggregation (has-many, independent lifetime)</text>

    <line x1="20" y1="66" x2="60" y2="66" stroke="#767268" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dep)"/>
    <text x="80" y="70" font-size="11" fill="#1c1b18">dependency (refers to / reads)</text>

    <line x1="320" y1="66" x2="384" y2="66" stroke="#1c1b18" stroke-width="1.3"/>
    <text x="392" y="70" font-size="11" fill="#1c1b18">association (related record)</text>
  </g>
</svg>
