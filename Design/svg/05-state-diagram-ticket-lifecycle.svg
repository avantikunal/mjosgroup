<svg viewBox="0 0 950 830" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4740"/>
    </marker>
  </defs>
  <rect width="950" height="830" fill="#ffffff"/>
  <text x="475" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1b18">Ticket Lifecycle (State Diagram)</text>

  <!-- initial -->
  <circle cx="485" cy="30" r="8" fill="#1c1b18"/>
  <line x1="485" y1="38" x2="485" y2="48" stroke="#4a4740" stroke-width="1.4" marker-end="url(#st)"/>

  <!-- New -->
  <rect x="395" y="50" width="180" height="50" rx="20" fill="#fdf3ec" stroke="#b3541e" stroke-width="1.5"/>
  <text x="485" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">New</text>

  <!-- Triage -->
  <rect x="140" y="150" width="180" height="60" rx="20" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="230" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Triage</text>

  <!-- AwaitingInfo -->
  <rect x="140" y="240" width="180" height="60" rx="20" fill="#fdf2f2" stroke="#a11b1b" stroke-width="1.5"/>
  <text x="230" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Awaiting Info</text>

  <!-- Scheduled -->
  <rect x="400" y="330" width="170" height="50" rx="20" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
  <text x="485" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Scheduled</text>

  <!-- EnRoute -->
  <rect x="400" y="420" width="170" height="50" rx="20" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
  <text x="485" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">En Route</text>

  <!-- OnSite -->
  <rect x="400" y="510" width="170" height="50" rx="20" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
  <text x="485" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">On Site</text>

  <!-- AwaitingParts -->
  <rect x="700" y="505" width="190" height="60" rx="20" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="795" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Awaiting Parts</text>

  <!-- Resolved -->
  <rect x="400" y="600" width="170" height="50" rx="20" fill="#f4f8ec" stroke="#3f6212" stroke-width="1.5"/>
  <text x="485" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Resolved</text>

  <!-- InvoicePending -->
  <rect x="700" y="595" width="190" height="60" rx="20" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="795" y="630" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1b18">Invoice Pending</text>

  <!-- Closed -->
  <rect x="400" y="690" width="170" height="50" rx="20" fill="#f4f8ec" stroke="#3f6212" stroke-width="1.5"/>
  <text x="485" y="720" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Closed</text>

  <!-- Reopened -->
  <rect x="140" y="690" width="180" height="60" rx="20" fill="#fdf2f2" stroke="#a11b1b" stroke-width="1.5"/>
  <text x="230" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b18">Reopened</text>

  <!-- final -->
  <circle cx="485" cy="790" r="9" fill="#1c1b18"/>
  <circle cx="485" cy="790" r="13" fill="none" stroke="#1c1b18" stroke-width="1.5"/>

  <!-- transitions -->
  <path d="M440,100 C300,120 260,130 232,148" fill="none" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="255" y="118" font-size="10" fill="#4a4740">missing commissioning data (RULE_08) /</text>
  <text x="255" y="130" font-size="10" fill="#4a4740">low-confidence voice draft</text>

  <path d="M420,100 C300,180 280,200 234,238" fill="none" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="290" y="222" font-size="10" fill="#4a4740">evidence incomplete</text>

  <line x1="485" y1="100" x2="485" y2="326" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="495" y="215" font-size="10" fill="#4a4740">party &amp; priority assigned,</text>
  <text x="495" y="227" font-size="10" fill="#4a4740">visit booked</text>

  <path d="M320,178 C380,220 400,270 448,338" fill="none" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="335" y="270" font-size="10" fill="#4a4740">back-office verifies</text>

  <path d="M320,268 C400,300 420,310 452,348" fill="none" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="335" y="308" font-size="10" fill="#4a4740">evidence supplied</text>

  <line x1="485" y1="380" x2="485" y2="416" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="495" y="404" font-size="10" fill="#4a4740">technician dispatched</text>

  <line x1="485" y1="470" x2="485" y2="506" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="495" y="494" font-size="10" fill="#4a4740">technician arrives</text>

  <line x1="570" y1="530" x2="696" y2="530" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="580" y="522" font-size="10" fill="#4a4740">part required, not on the van</text>

  <line x1="485" y1="560" x2="485" y2="596" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="495" y="584" font-size="10" fill="#4a4740">fault fixed on this visit</text>

  <path d="M700,510 C610,440 590,400 574,362" fill="none" stroke="#b45309" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="600" y="440" font-size="10" fill="#7a4109">part received, re-booked</text>

  <line x1="570" y1="620" x2="696" y2="620" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="585" y="612" font-size="10" fill="#4a4740">chargeable = true</text>

  <line x1="485" y1="650" x2="485" y2="686" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="495" y="674" font-size="10" fill="#4a4740">chargeable = false</text>
  <text x="495" y="686" font-size="10" fill="#4a4740">(warranty/contract/referred)</text>

  <path d="M760,655 C700,680 640,690 574,706" fill="none" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="650" y="678" font-size="10" fill="#4a4740">invoice issued</text>

  <line x1="396" y1="712" x2="324" y2="715" stroke="#a11b1b" stroke-width="1.3" marker-end="url(#st)"/>
  <text x="330" y="705" font-size="10" fill="#a11b1b">customer reports same fault again</text>

  <path d="M170,688 C90,500 90,280 168,190" fill="none" stroke="#a11b1b" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#st)"/>
  <text x="20" y="470" font-size="10" fill="#a11b1b" transform="rotate(-90 20 470)" text-anchor="middle">re-enters triage — RULE_10 repeat-fault flag likely applies</text>

  <line x1="485" y1="740" x2="485" y2="776" stroke="#4a4740" stroke-width="1.3" marker-end="url(#st)"/>

  <!-- note -->
  <rect x="600" y="50" width="320" height="80" rx="8" fill="#fdf2f2" stroke="#a11b1b" stroke-width="1.2"/>
  <text x="614" y="70" font-size="11" fill="#6b1414">
    <tspan x="614" dy="0" font-weight="700">Note</tspan>
    <tspan x="614" dy="16">Emergency tickets (RULE_01/RULE_02) skip</tspan>
    <tspan x="614" dy="14">this lifecycle entirely and are handled</tspan>
    <tspan x="614" dy="14">outside the ticketing flow — see diagram 01.</tspan>
  </text>
  <line x1="600" y1="90" x2="575" y2="75" stroke="#a11b1b" stroke-width="1" stroke-dasharray="3 2"/>
</svg>
