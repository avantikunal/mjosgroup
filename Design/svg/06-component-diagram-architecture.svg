<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4740"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1b18">Aftercare Workbench — Component / Architecture Diagram</text>

  <!-- actor -->
  <circle cx="90" cy="90" r="9" fill="none" stroke="#1c1b18" stroke-width="1.6"/>
  <line x1="90" y1="99" x2="90" y2="119" stroke="#1c1b18" stroke-width="1.6"/>
  <line x1="75" y1="107" x2="105" y2="107" stroke="#1c1b18" stroke-width="1.6"/>
  <line x1="90" y1="119" x2="76" y2="134" stroke="#1c1b18" stroke-width="1.6"/>
  <line x1="90" y1="119" x2="104" y2="134" stroke="#1c1b18" stroke-width="1.6"/>
  <text x="90" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1b18">Office Admin /</text>
  <text x="90" y="166" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1b18">Technician / Manager</text>

  <!-- Browser package -->
  <rect x="210" y="50" width="300" height="380" fill="#fbfaf7" stroke="#c9c4b6" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="222" y="68" font-size="11" font-weight="700" fill="#767268" letter-spacing="0.5">BROWSER — NO BUILD STEP</text>

  <rect x="230" y="80" width="260" height="44" rx="6" fill="#ffffff" stroke="#1c1b18" stroke-width="1.4"/>
  <text x="360" y="106" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">index.html</text>

  <rect x="230" y="134" width="260" height="44" rx="6" fill="#ffffff" stroke="#1c1b18" stroke-width="1.4"/>
  <text x="360" y="160" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">styles.css</text>

  <rect x="230" y="188" width="260" height="90" rx="6" fill="#fdf3ec" stroke="#b3541e" stroke-width="1.5"/>
  <text x="360" y="222" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace, Consolas, monospace">app.js</text>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="#4a4740">vanilla ES module, no framework</text>
  <text x="360" y="256" text-anchor="middle" font-size="11" fill="#4a4740">renders every view, calls the API</text>

  <rect x="230" y="290" width="260" height="120" rx="8" fill="#fdf3ec" stroke="#b3541e" stroke-width="1.2"/>
  <text x="244" y="308" font-size="10.5" fill="#8a3f14">
    <tspan x="244" dy="0" font-weight="700">Note</tspan>
    <tspan x="244" dy="16">Renders all customer-supplied text as</tspan>
    <tspan x="244" dy="14">DOM text nodes, never innerHTML —</tspan>
    <tspan x="244" dy="14">closes off stored XSS from fault</tspan>
    <tspan x="244" dy="14">descriptions or voice transcripts.</tspan>
  </text>

  <!-- Node package -->
  <rect x="560" y="50" width="560" height="560" fill="#fbfaf7" stroke="#c9c4b6" stroke-width="1.3" stroke-dasharray="6 3"/>
  <text x="572" y="68" font-size="11" font-weight="700" fill="#767268" letter-spacing="0.5">NODE PROCESS — server/index.js · ZERO NPM DEPENDENCIES</text>

  <rect x="590" y="80" width="500" height="50" rx="6" fill="#ffffff" stroke="#1c1b18" stroke-width="1.5"/>
  <text x="840" y="110" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace, Consolas, monospace">HTTP + static file server</text>

  <rect x="590" y="150" width="230" height="60" rx="6" fill="#ffffff" stroke="#1c1b18" stroke-width="1.4"/>
  <text x="705" y="176" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">reference.js</text>
  <text x="705" y="192" text-anchor="middle" font-size="10" fill="#767268">policy config</text>

  <rect x="850" y="150" width="230" height="60" rx="6" fill="#fff8ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="965" y="176" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">triage.js</text>
  <text x="965" y="192" text-anchor="middle" font-size="10" fill="#7a4109">rules engine</text>

  <rect x="590" y="230" width="230" height="60" rx="6" fill="#eef4f8" stroke="#1d5f7a" stroke-width="1.5"/>
  <text x="705" y="256" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">classifier.js</text>
  <text x="705" y="272" text-anchor="middle" font-size="10" fill="#1d5f7a">voice-intake stub</text>

  <rect x="850" y="230" width="230" height="60" rx="6" fill="#ffffff" stroke="#1c1b18" stroke-width="1.4"/>
  <text x="965" y="256" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">store.js</text>
  <text x="965" y="272" text-anchor="middle" font-size="10" fill="#767268">in-memory + persistence</text>

  <rect x="590" y="310" width="230" height="50" rx="6" fill="#ffffff" stroke="#1c1b18" stroke-width="1.4"/>
  <text x="705" y="340" text-anchor="middle" font-size="12" font-family="ui-monospace, Consolas, monospace">data.js</text>

  <!-- JSON file cylinder -->
  <ellipse cx="965" cy="318" rx="115" ry="10" fill="#f4f8ec" stroke="#3f6212" stroke-width="1.5"/>
  <path d="M850,318 L850,352 A115,10 0 0 0 1080,352 L1080,318" fill="#f4f8ec" stroke="#3f6212" stroke-width="1.5"/>
  <line x1="850" y1="318" x2="850" y2="352" stroke="#3f6212" stroke-width="1.5"/>
  <line x1="1080" y1="318" x2="1080" y2="352" stroke="#3f6212" stroke-width="1.5"/>
  <text x="965" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a0d" font-family="ui-monospace, Consolas, monospace">data/tickets.json</text>

  <!-- triage note -->
  <rect x="850" y="400" width="230" height="120" rx="8" fill="#fff8ed" stroke="#b45309" stroke-width="1.2"/>
  <text x="864" y="418" font-size="10.5" fill="#7a4109">
    <tspan x="864" dy="0" font-weight="700">Note</tspan>
    <tspan x="864" dy="16">Pure function: (site, report,</tspan>
    <tspan x="864" dy="14">history) -&gt; decision. Same inputs</tspan>
    <tspan x="864" dy="14">always produce the same party /</tspan>
    <tspan x="864" dy="14">priority / chargeable outcome.</tspan>
  </text>

  <!-- classifier note -->
  <rect x="590" y="400" width="230" height="120" rx="8" fill="#eef4f8" stroke="#1d5f7a" stroke-width="1.2"/>
  <text x="604" y="418" font-size="10.5" fill="#1d5f7a">
    <tspan x="604" dy="0" font-weight="700">Note</tspan>
    <tspan x="604" dy="16">Deterministic regex/keyword</tspan>
    <tspan x="604" dy="14">stub. Swappable behind the same</tspan>
    <tspan x="604" dy="14">interface for a real ASR + LLM</tspan>
    <tspan x="604" dy="14">pipeline later (PRD §9).</tspan>
  </text>

  <!-- arrows -->
  <line x1="103" y1="120" x2="228" y2="220" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="112" y="180" font-size="10" fill="#4a4740">uses (mouse /</text>
  <text x="112" y="192" font-size="10" fill="#4a4740">keyboard / mic)</text>

  <line x1="490" y1="215" x2="588" y2="112" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="498" y="170" font-size="10" fill="#4a4740">fetch() JSON over HTTP</text>
  <text x="498" y="182" font-size="10" fill="#4a4740">(same-origin, CSP-restricted)</text>

  <line x1="800" y1="130" x2="720" y2="148" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <line x1="880" y1="130" x2="960" y2="148" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="885" y="142" font-size="9.5" fill="#4a4740"></text>
  <line x1="770" y1="130" x2="710" y2="228" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <line x1="910" y1="130" x2="960" y2="228" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>

  <text x="600" y="140" font-size="9.5" fill="#4a4740">reference</text>
  <text x="985" y="140" font-size="9.5" fill="#4a4740">store</text>
  <text x="605" y="200" font-size="9.5" fill="#4a4740">classifier</text>
  <text x="978" y="205" font-size="9.5" fill="#4a4740">(ticket CRUD)</text>

  <line x1="965" y1="230" x2="965" y2="212" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="820" y="222" font-size="10" fill="#4a4740">triage(site, report, history)</text>

  <line x1="850" y1="180" x2="822" y2="180" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="822" y="145" font-size="10" fill="#4a4740">read rule inputs</text>

  <line x1="900" y1="270" x2="835" y2="325" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="822" y="300" font-size="10" fill="#4a4740">seed on first boot</text>

  <line x1="965" y1="290" x2="965" y2="316" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="978" y="305" font-size="9.5" fill="#4a4740">read / write</text>

  <line x1="705" y1="230" x2="705" y2="212" stroke="#4a4740" stroke-width="1.3" marker-end="url(#ca)"/>
  <text x="590" y="222" font-size="10" fill="#4a4740">(fault type ids)</text>
</svg>
